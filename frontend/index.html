<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Liquidación de Choferes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var guardado = localStorage.getItem('tema');
    var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
    document.documentElement.setAttribute('data-tema', tema);
  })();
</script>
</head>
<body class="pantalla-login">

  <button type="button" id="boton-tema" class="boton-tema" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>

  <main class="tarjeta-login">
    <div class="marca-login">
      <span class="marca-login__linea"></span>
      <h1 class="marca-login__titulo">Liquidación<br>de Choferes</h1>
      <p class="marca-login__subtitulo">Tienda León</p>
    </div>

    <form id="form-login" class="formulario" novalidate>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
      </div>

      <p id="mensaje-error" class="mensaje-error" role="alert" hidden></p>

      <button type="submit" class="boton boton--primario boton--ancho-completo" id="boton-ingresar">
        Ingresar
      </button>
    </form>
  </main>

  <script src="js/tema.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
